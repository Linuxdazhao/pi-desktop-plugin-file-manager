<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git 模式 · 方案一 三栏工作台</title>
<style>
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #181818; --surface: #181818; --surface-raised: #1f1f1f;
    --hover: color-mix(in oklab, #ffffff 6%, transparent);
    --active: color-mix(in oklab, #ffffff 10%, transparent);
    --fg: #ffffff;
    --secondary: color-mix(in oklab, #ffffff 70%, transparent);
    --muted: color-mix(in oklab, #ffffff 52%, transparent);
    --faint: color-mix(in oklab, #ffffff 34%, transparent);
    --border: color-mix(in oklab, #ffffff 5%, transparent);
    --border-strong: color-mix(in oklab, #ffffff 14%, transparent);
    --added: #3fb950; --modified: #d29922; --deleted: #f85149; --renamed: #58a6ff; --conflicted: #bc8cff;
    --wash-add: color-mix(in oklab, #3fb950 13%, transparent);
    --wash-del: color-mix(in oklab, #f85149 13%, transparent);
    --tok-add: color-mix(in oklab, #3fb950 30%, transparent);
    --shadow: 0 10px 34px #0009;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --surface-raised: #f3f3f3;
    --hover: color-mix(in oklab, #1a1c1f 5%, transparent);
    --active: color-mix(in oklab, #1a1c1f 8%, transparent);
    --fg: #1a1c1f;
    --secondary: color-mix(in oklab, #1a1c1f 74%, transparent);
    --muted: #5d5d5d; --faint: #949494;
    --border: color-mix(in oklab, #1a1c1f 7%, transparent);
    --border-strong: color-mix(in oklab, #1a1c1f 14%, transparent);
    --added: #1a7f37; --modified: #9a6700; --deleted: #cf222e; --renamed: #0969da; --conflicted: #8250df;
    --wash-add: color-mix(in oklab, #1a7f37 12%, transparent);
    --wash-del: color-mix(in oklab, #cf222e 11%, transparent);
    --tok-add: color-mix(in oklab, #1a7f37 26%, transparent);
    --shadow: 0 12px 30px #1a1c1f1f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d0d0f; color: var(--fg); font: 12px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 24px;
  }
  :root[data-theme="light"] body { background: #e6e6e9; }
  button, input, textarea { font: inherit; color: inherit; }

  .app {
    position: relative; width: min(1400px, 100%); height: min(870px, calc(100vh - 48px)); min-height: 600px;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 9px; box-shadow: var(--shadow);
  }
  .topbar {
    flex: none; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    border-bottom: 1px solid var(--border-strong);
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 11.5px; }
  .brand .mark { display: grid; place-items: center; width: 18px; height: 18px; color: var(--secondary); }
  .crumb { color: var(--faint); font-size: 11px; }
  .grow { flex: 1; }
  .icon-btn {
    display: grid; place-items: center; width: 26px; height: 26px; flex: none;
    border: 0; border-radius: 5px; background: transparent; color: var(--secondary); cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover); color: var(--fg); }
  button:focus-visible, .row:focus-visible, .tab:focus-visible { outline: 2px solid color-mix(in oklab, var(--fg) 50%, transparent); outline-offset: 1px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px;
    border-radius: 5px; border: 1px solid var(--border-strong); background: transparent;
    color: var(--secondary); font-size: 11.5px; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { background: var(--hover); color: var(--fg); }
  .chip .num { font: 10.5px/1 var(--mono); color: var(--fg); }
  .sep { width: 1px; height: 18px; background: var(--border-strong); flex: none; }

  .main { flex: 1; min-height: 0; display: flex; }

  /* 文件树 */
  .tree { flex: none; width: 208px; display: flex; flex-direction: column; border-right: 1px solid var(--border-strong); }
  .pane-head {
    flex: none; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    color: var(--faint); font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  }
  .tree-body { flex: 1; min-height: 0; overflow: auto; padding: 0 4px 8px; }
  .tnode {
    display: flex; align-items: center; gap: 5px; width: 100%; height: 23px; padding: 0 6px;
    border: 0; border-radius: 4px; background: transparent; color: var(--secondary);
    cursor: pointer; text-align: left; white-space: nowrap; font-size: 11.5px;
  }
  .tnode:hover { background: var(--hover); color: var(--fg); }
  .tnode[data-active="true"] { background: var(--active); color: var(--fg); box-shadow: inset 2px 0 var(--fg); }
  .tnode .ind { width: 12px; flex: none; color: var(--faint); display: grid; place-items: center; }
  .tnode .nm { overflow: hidden; text-overflow: ellipsis; }
  .tnode .badge { margin-left: auto; font: 700 9.5px/1 var(--mono); flex: none; }
  .i1 { padding-left: 20px; } .i2 { padding-left: 34px; }

  /* 导航器 */
  .nav { flex: none; width: 310px; display: flex; flex-direction: column; border-right: 1px solid var(--border-strong); background: var(--surface-raised); position: relative; z-index: 2; }
  .seg-scope { display: flex; gap: 2px; padding: 2px; margin: 8px 8px 0; border-radius: 6px; background: var(--hover); }
  .seg-scope button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    border: 0; border-radius: 4px; background: transparent; padding: 4px 6px;
    color: var(--muted); font-size: 11px; cursor: pointer;
  }
  .seg-scope button[aria-selected="true"] { background: var(--surface-raised); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-strong); }
  .seg-scope .n { font: 9.5px/1 var(--mono); color: var(--faint); }
  .nav-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 6px 8px; }
  .nav-foot { flex: none; border-top: 1px solid var(--border-strong); padding: 8px; }

  .gh { display: flex; align-items: center; gap: 6px; width: 100%; height: 25px; padding: 0 4px; border: 0; border-radius: 4px; background: transparent; color: var(--secondary); font-size: 10.5px; font-weight: 600; cursor: pointer; }
  .gh:hover { background: var(--hover); }
  .gh .car { color: var(--faint); display: grid; place-items: center; transition: transform .12s; }
  .gh[aria-expanded="false"] .car { transform: rotate(-90deg); }
  .gh .cnt { font: 9.5px/1 var(--mono); color: var(--faint); }
  .gh .all { margin-left: auto; font-size: 10px; font-weight: 400; color: var(--muted); padding: 1px 4px; border-radius: 3px; opacity: 0; }
  .gh:hover .all { opacity: 1; }
  .gh .all:hover { background: var(--active); color: var(--fg); }

  .row {
    position: relative; display: flex; align-items: center; gap: 6px; width: 100%; height: 24px;
    padding: 0 4px 0 0; border: 0; border-radius: 4px; background: transparent; cursor: pointer; text-align: left;
  }
  .row::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; background: transparent; }
  .row[data-k="M"]::before { background: var(--modified); }
  .row[data-k="A"]::before, .row[data-k="?"]::before { background: var(--added); }
  .row[data-k="D"]::before { background: var(--deleted); }
  .row[data-k="R"]::before { background: var(--renamed); }
  .row:hover { background: var(--hover); }
  .row[data-sel="true"] { background: var(--active); }
  .row[data-sel="true"] .rn { font-weight: 600; }
  .row .st { flex: none; width: 15px; text-align: center; font: 700 10px/1 var(--mono); }
  .row[data-k="M"] .st { color: var(--modified); } .row[data-k="A"] .st, .row[data-k="?"] .st { color: var(--added); }
  .row[data-k="D"] .st { color: var(--deleted); } .row[data-k="R"] .st { color: var(--renamed); }
  .row .lb { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px; overflow: hidden; }
  .row .rd { order: -1; color: var(--faint); font: 9.5px/1 var(--mono); white-space: nowrap; overflow: hidden; direction: rtl; unicode-bidi: plaintext; }
  .row .rn { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .dl { flex: none; display: flex; gap: 3px; font: 9.5px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .row .dl .a { color: var(--added); } .row .dl .d { color: var(--deleted); }
  .row .act { flex: none; width: 17px; height: 17px; display: grid; place-items: center; border: 0; border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer; opacity: 0; }
  .row:hover .act { opacity: 1; }
  .row .act:hover { background: var(--active); color: var(--fg); }

  /* 历史 / 分支行 */
  .crow { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 5px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; text-align: left; }
  .crow:hover { background: var(--hover); }
  .crow[data-sel="true"] { background: var(--active); }
  .crow .dot { flex: none; width: 14px; display: grid; place-items: center; }
  .crow .dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--modified); display: block; }
  .crow[data-merge="true"] .dot i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--renamed); }
  .crow .body { flex: 1; min-width: 0; }
  .crow .subj { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .crow .meta { display: flex; gap: 5px; align-items: center; color: var(--faint); font-size: 9.5px; }
  .crow .sha { font-family: var(--mono); }
  .ref { height: 14px; padding: 0 4px; border-radius: 3px; display: inline-flex; align-items: center; font: 9px/1 var(--mono); border: 1px solid var(--border-strong); color: var(--muted); }
  .ref.local { color: var(--fg); border-color: color-mix(in oklab, var(--fg) 34%, transparent); }
  .ref.remote { color: var(--renamed); border-color: color-mix(in oklab, var(--renamed) 40%, transparent); }
  .ref.tag { color: var(--modified); border-color: color-mix(in oklab, var(--modified) 40%, transparent); }
  .brow { display: flex; align-items: center; gap: 7px; width: 100%; padding: 5px 6px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; text-align: left; }
  .brow:hover { background: var(--hover); }
  .brow .nm { font-size: 11.5px; }
  .brow .now { font: 9px/1 var(--mono); padding: 1px 4px; border-radius: 3px; background: var(--active); color: var(--secondary); }
  .brow .trk { margin-left: auto; font: 9.5px/1 var(--mono); color: var(--faint); }

  /* 提交框 */
  .composer { border: 1px solid var(--border-strong); border-radius: 6px; background: var(--bg); overflow: hidden; }
  .composer:focus-within { border-color: color-mix(in oklab, var(--fg) 34%, transparent); }
  .composer textarea { display: block; width: 100%; min-height: 52px; max-height: 110px; resize: vertical; border: 0; outline: none; background: transparent; padding: 7px 8px 3px; font: 12px/1.5 var(--sans); }
  .composer textarea::placeholder { color: var(--faint); }
  .cbar { display: flex; align-items: center; gap: 6px; padding: 4px 5px 5px 8px; border-top: 1px solid var(--border); }
  .cbar .hint { font-size: 10px; color: var(--faint); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .primary { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border: 0; border-radius: 5px; background: var(--fg); color: var(--bg); font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .primary:disabled { background: var(--active); color: var(--faint); cursor: not-allowed; }
  .primary .n { font: 10px/1 var(--mono); opacity: .7; }

  /* 内容区 */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; z-index: 0; }
  .tabs { flex: none; display: flex; align-items: stretch; gap: 2px; height: 32px; padding: 4px 6px 0; background: var(--surface-raised); border-bottom: 1px solid var(--border-strong); overflow-x: auto; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 5px 5px 0 0; background: transparent; color: var(--muted); font-size: 11.5px; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--fg); background: var(--hover); }
  .tab[aria-selected="true"] { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: inset 0 2px 0 var(--secondary); }
  .tab .x { display: grid; place-items: center; width: 15px; height: 15px; border-radius: 3px; color: var(--faint); }
  .tab .x:hover { background: var(--active); color: var(--fg); }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .fhead { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 4px; font: 700 10px/1 var(--mono); flex: none; }
  .badge.M { color: var(--modified); background: color-mix(in oklab, var(--modified) 17%, transparent); }
  .badge.A { color: var(--added); background: color-mix(in oklab, var(--added) 17%, transparent); }
  .badge.D { color: var(--deleted); background: color-mix(in oklab, var(--deleted) 17%, transparent); }
  .badge.R { color: var(--renamed); background: color-mix(in oklab, var(--renamed) 17%, transparent); }
  .fpath { font: 12px/1.35 var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fpath .d { color: var(--faint); }
  .nums { display: flex; gap: 6px; font: 10.5px/1 var(--mono); flex: none; }
  .nums .a { color: var(--added); } .nums .d { color: var(--deleted); }
  .ftools { margin-left: auto; display: flex; gap: 4px; flex: none; }
  .fsub { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 7px; border-bottom: 1px solid var(--border); }
  .seg2 { display: inline-flex; gap: 2px; padding: 2px; border-radius: 6px; background: var(--hover); }
  .seg2 button { border: 0; border-radius: 4px; background: transparent; padding: 3px 8px; color: var(--muted); font-size: 10.5px; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  .seg2 button[aria-selected="true"] { background: var(--surface-raised); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-strong); }
  .seg2 .n { font: 9.5px/1 var(--mono); color: var(--faint); }
  .meta { color: var(--faint); font-size: 10.5px; }

  .diff { flex: 1; min-height: 0; overflow: auto; font: 11.5px/1.62 var(--mono); }
  .hunk { display: flex; align-items: center; gap: 8px; padding: 3px 12px; background: var(--surface-raised); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 10.5px; position: sticky; top: 0; }
  .hunk .r { color: var(--renamed); font-variant-numeric: tabular-nums; }
  .hunk .c { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln { display: flex; align-items: flex-start; min-height: 19px; }
  .ln .no { flex: none; width: 36px; padding-right: 8px; text-align: right; color: var(--faint); font-size: 10.5px; user-select: none; }
  .ln .sg { flex: none; width: 13px; text-align: center; color: var(--faint); }
  .ln .cd { flex: 1; padding-right: 14px; color: var(--secondary); white-space: pre-wrap; word-break: break-word; }
  .ln.add { background: var(--wash-add); } .ln.add .cd { color: var(--fg); } .ln.add .sg { color: var(--added); }
  .ln.del { background: var(--wash-del); } .ln.del .sg { color: var(--deleted); }
  .tok { background: var(--tok-add); border-radius: 2px; }
  .k { color: #c678dd; } .s { color: #98c379; } .n { color: #d19a66; } .cm { color: var(--faint); font-style: italic; }
  :root[data-theme="light"] .k { color: #a626a4; } :root[data-theme="light"] .s { color: #3f8a3a; } :root[data-theme="light"] .n { color: #986801; }

  /* 源码视图 */
  .src { flex: 1; min-height: 0; overflow: auto; font: 11.5px/1.62 var(--mono); }
  .src .ln .no { width: 40px; }
  .empty { flex: 1; display: grid; place-items: center; color: var(--faint); font-size: 12px; }

  /* 提交检视 */
  .cinfo { flex: none; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .cinfo h2 { margin: 0 0 6px; font-size: 13.5px; font-weight: 600; }
  .cinfo .m { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 11px; }
  .cinfo .m .mono { font-family: var(--mono); }
  .cbody { flex: 1; min-height: 0; display: flex; }
  .cfiles { flex: none; width: 232px; border-right: 1px solid var(--border-strong); overflow: auto; padding: 4px 5px 8px; }

  .statusbar { flex: none; height: 24px; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--surface-raised); border-top: 1px solid var(--border-strong); color: var(--muted); font-size: 10.5px; }
  .statusbar .it { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .statusbar .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .toast { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 11.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .16s; max-width: 70%; text-align: center; }
  .toast.on { opacity: 1; }
  [hidden] { display: none !important; }
  @media (max-width: 1100px) { .tree { display: none; } .nav { width: 280px; } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">
      <span class="mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h6l2 2h10v12H3z"/></svg></span>
      文件管理器
    </span>
    <span class="crumb">/ pi-desktop-plugin-file-manager</span>
    <span class="sep"></span>
    <button class="chip" id="branchChip" title="切换分支">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 8.2v7.6M18 11.2c0 3-4 3.4-6 4"/></svg>
      <span id="branchName">main</span>
    </button>
    <span class="grow"></span>
    <button class="chip" id="pullBtn" title="Pull（快进）"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg> Pull <span class="num" id="behind">0</span></button>
    <button class="chip" id="pushBtn" title="Push"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20V8m0 0-5 5m5-5 5 5M5 4h14"/></svg> Push <span class="num" id="ahead">3</span></button>
    <button class="icon-btn" id="themeBtn" title="切换亮/暗" aria-label="切换亮色或暗色主题"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></button>
  </div>

  <div class="main">
    <!-- 文件树 -->
    <aside class="tree">
      <div class="pane-head">文件<button class="icon-btn" style="margin-left:auto;width:20px;height:20px" title="搜索文件">⌕</button></div>
      <div class="tree-body" id="tree"></div>
    </aside>

    <!-- 导航器 -->
    <section class="nav" aria-label="Git 导航器">
      <div class="seg-scope" role="tablist" aria-label="导航器作用域">
        <button role="tab" type="button" data-scope="changes" aria-selected="true">变更 <span class="n" id="scopeChangeCount">9</span></button>
        <button role="tab" type="button" data-scope="history" aria-selected="false">历史</button>
        <button role="tab" type="button" data-scope="branches" aria-selected="false">分支 <span class="n">4</span></button>
      </div>
      <div class="nav-body" id="navBody"></div>
      <div class="nav-foot" id="navFoot"></div>
    </section>

    <!-- 内容区 -->
    <section class="content" aria-label="内容区">
      <div class="tabs" id="tabs" role="tablist" aria-label="标签"></div>
      <div id="views"></div>
    </section>
  </div>

  <div class="statusbar">
    <span class="it"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 8.2v7.6M18 11.2c0 3-4 3.4-6 4"/></svg><span id="sbBranch">main</span></span>

    sub.innerHTML = '<div class="seg2" role="tablist"><button role="tab" aria-selected="true" type="button">未暂存 <span class="n">+' + add + " −" + del + '</span></button>' +
      '<button role="tab" aria-selected="false" type="button">已暂存 <span class="n">+' + Math.max(1, add - 3) + " −" + Math.max(0, del - 3) + "</span></button></div>" +
      '<span class="meta">' + (readonly ? "与父提交比较" : "暂存区 → 磁盘") + " · 2 处 hunk</span>";
    sub.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        sub.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-selected", String(x === b)); });
        toast(b.textContent.split(" ")[0] + " 视图（演示数据相同）");
      });
    });
    head.appendChild(sub);
    return head;
  }
  function diffBody() {
    var d = el("div", "diff");
    DIFF.forEach(function (h) {
      var hh = el("div", "hunk", '<span class="r">' + esc(h.h.split(" ")[0]) + "</span><span class='c'>" + esc(h.h.replace(/^@@\s*\S+\s*\S+\s*@@\s*/, "")) + "</span>");
      d.appendChild(hh);
      h.lines.forEach(function (l) {
        d.appendChild(el("div", "ln" + (l[0] === "+" ? " add" : l[0] === "-" ? " del" : ""),
          '<span class="no">' + (l[2] || "") + '</span><span class="sg">' + (l[0] || " ") + '</span><span class="cd">' + l[3] + "</span>"));
      });
    });
    return d;
  }
  function sourceBody(path) {
    var d = el("div", "src");
    var lines = [
      "<span class='cm'>// " + path.replace(/</g, "&lt;") + "</span>",
      "<span class='k'>import</span> { useState } <span class='k'>from</span> <span class='s'>\"react\"</span>;",
      "",
      "<span class='k'>export function</span> <span class='n'>view</span>() {",
      "  <span class='k'>const</span> [state, setState] = <span class='n'>useState</span>(<span class='k'>null</span>);",
      "  <span class='k'>return</span> state;",
      "}"
    ];
    lines.forEach(function (t, i) {
      d.appendChild(el("div", "ln", '<span class="no">' + (i + 1) + '</span><span class="cd">' + t + "</span>"));
    });
    return d;
  }

  function renderAll() {
    renderTree();
    document.querySelectorAll(".seg-scope button").forEach(function (b) {
      b.setAttribute("aria-selected", String(b.dataset.scope === S.scope));
    });
    $("#scopeChangeCount").textContent = totalCount();
    var body = $("#navBody"); body.innerHTML = "";
    if (S.scope === "changes") renderChanges(body);
    else if (S.scope === "history") renderHistory(body);
    else renderBranches(body);
    renderFoot();
    renderTabs();
    renderViews();
    syncComposer();
    $("#branchName").textContent = S.branch;
    $("#sbBranch").textContent = S.branch;
    $("#ahead").textContent = S.ahead;
    $("#behind").textContent = S.behind;
    $("#sbAhead").textContent = "↑" + S.ahead;
    $("#sbBehind").textContent = "↓" + S.behind;
    $("#sbDirty").textContent = "●" + (working().length + UNTRACKED.length);
    $("#sbState").textContent = stagedList().length + " 个已暂存 · " + (working().length + UNTRACKED.length) + " 个未暂存";
  }

  /* ───── 绑定 ───── */
  document.querySelectorAll(".seg-scope button").forEach(function (b) {
    b.addEventListener("click", function () { S.scope = b.dataset.scope; renderAll(); });
  });
  $("#themeBtn").addEventListener("click", function () {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  });
  $("#pushBtn").addEventListener("click", function () { toast(S.ahead ? "已推送 " + S.ahead + " 个提交到 origin/" + S.branch : "没有需要推送的提交"); if (S.ahead) { S.ahead = 0; renderAll(); } });
  $("#pullBtn").addEventListener("click", function () { toast("已是最新（演示不联网）"); });
  $("#branchChip").addEventListener("click", function () { S.scope = "branches"; renderAll(); });

  /* 首屏：默认打开第一个暂存文件的差异，让 diff 一进来就可见 */
  S.active = S.staged[0] || working()[0] || null;
  if (S.active) { S.tabs.push(S.active); S.previewOpen = true; }
  renderAll();
})();
</script>
</body>
</html>
