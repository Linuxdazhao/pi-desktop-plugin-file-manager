<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git 模式 · 方案三 历史优先</title>
<style>
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #181818; --surface: #181818; --raised: #1f1f1f; --deep: #141416;
    --hover: color-mix(in oklab, #ffffff 6%, transparent);
    --active: color-mix(in oklab, #ffffff 10%, transparent);
    --fg: #ffffff;
    --secondary: color-mix(in oklab, #ffffff 70%, transparent);
    --muted: color-mix(in oklab, #ffffff 52%, transparent);
    --faint: color-mix(in oklab, #ffffff 34%, transparent);
    --border: color-mix(in oklab, #ffffff 5%, transparent);
    --border-strong: color-mix(in oklab, #ffffff 14%, transparent);
    --added: #3fb950; --modified: #d29922; --deleted: #f85149; --renamed: #58a6ff;
    --wash-add: color-mix(in oklab, #3fb950 13%, transparent);
    --wash-del: color-mix(in oklab, #f85149 13%, transparent);
    --tok: color-mix(in oklab, #3fb950 30%, transparent);
    --shadow: 0 10px 34px #0009;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --raised: #f3f3f3; --deep: #f0f0f2;
    --hover: color-mix(in oklab, #1a1c1f 5%, transparent);
    --active: color-mix(in oklab, #1a1c1f 9%, transparent);
    --fg: #1a1c1f;
    --secondary: color-mix(in oklab, #1a1c1f 74%, transparent);
    --muted: #5d5d5d; --faint: #949494;
    --border: color-mix(in oklab, #1a1c1f 7%, transparent);
    --border-strong: color-mix(in oklab, #1a1c1f 14%, transparent);
    --added: #1a7f37; --modified: #9a6700; --deleted: #cf222e; --renamed: #0969da;
    --wash-add: color-mix(in oklab, #1a7f37 12%, transparent);
    --wash-del: color-mix(in oklab, #cf222e 11%, transparent);
    --tok: color-mix(in oklab, #1a7f37 26%, transparent);
    --shadow: 0 12px 30px #1a1c1f1f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0d0d0f; color: var(--fg); font: 12px/1.45 var(--sans); -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 24px; }
  :root[data-theme="light"] body { background: #e6e6e9; }
  button, textarea { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid color-mix(in oklab, var(--fg) 50%, transparent); outline-offset: 1px; }

  .app {
    position: relative; width: min(1420px, 100%); height: min(880px, calc(100vh - 48px)); min-height: 620px;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 9px; box-shadow: var(--shadow);
  }
  .topbar { flex: none; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border-strong); }
  .brand { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 11.5px; }
  .crumb { color: var(--faint); font-size: 11px; }
  .grow { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--border-strong); background: transparent; color: var(--secondary); font-size: 11px; cursor: pointer; white-space: nowrap; }
  .chip:hover { background: var(--hover); color: var(--fg); }
  .chip .num { font: 10px/1 var(--mono); color: var(--fg); }
  .icon-btn { display: grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 5px; background: transparent; color: var(--secondary); cursor: pointer; }
  .icon-btn:hover { background: var(--hover); color: var(--fg); }

  /* 视图切换 */
  .modes { flex: none; display: flex; gap: 2px; padding: 6px 12px; border-bottom: 1px solid var(--border); align-items: center; }
  .modes button {
    border: 0; border-radius: 5px; background: transparent; padding: 4px 10px;
    color: var(--muted); font-size: 11.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .modes button:hover { color: var(--fg); background: var(--hover); }
  .modes button[aria-selected="true"] { background: var(--raised); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-strong); }
  .modes .n { font: 9.5px/1 var(--mono); color: var(--faint); }
  .modes .hint { margin-left: auto; font-size: 10.5px; color: var(--faint); }

  /* 上半：列表 */
  .list { flex: 1 1 52%; min-height: 0; overflow: auto; background: var(--bg); }
  .list.history { background: var(--surface); }

  /* 提交图行 */
  .grow-row {
    position: relative; display: flex; align-items: center; gap: 0; width: 100%;
    min-height: 34px; padding: 0; border: 0; background: transparent; cursor: pointer; text-align: left;
  }
  .grow-row:hover { background: var(--hover); }
  .grow-row[aria-selected="true"] { background: var(--active); box-shadow: inset 3px 0 var(--fg); }
  .grow-row .graph { flex: none; width: 62px; position: relative; align-self: stretch; }
  .grow-row .graph svg { position: absolute; inset: 0; }
  .grow-row .unpush { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--modified); }
  .grow-row .cbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 4px 0; }
  .grow-row .s1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .grow-row .subj { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow-row[aria-selected="true"] .subj { font-weight: 600; }
  .grow-row .s2 { display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 10px; min-width: 0; }
  .grow-row .sha { font-family: var(--mono); color: var(--muted); }
  .grow-row .who { display: inline-flex; align-items: center; gap: 4px; }
  .grow-row .av { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; font: 700 7.5px/1 var(--sans); color: var(--bg); background: var(--secondary); }
  .grow-row .tags { margin-left: auto; display: flex; gap: 3px; flex: none; }
  .grow-row .stat { font: 9.5px/1 var(--mono); color: var(--faint); flex: none; padding-right: 8px; }
  .ref { height: 14px; padding: 0 4px; border-radius: 3px; display: inline-flex; align-items: center; font: 8.5px/1 var(--mono); border: 1px solid var(--border-strong); color: var(--muted); }
  .ref.local { color: var(--fg); border-color: color-mix(in oklab, var(--fg) 34%, transparent); }
  .ref.remote { color: var(--renamed); border-color: color-mix(in oklab, var(--renamed) 40%, transparent); }
  .ref.tag { color: var(--modified); border-color: color-mix(in oklab, var(--modified) 40%, transparent); }

  /* 工作区虚拟行 */
  .ws-row {
    display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 0 12px 0 8px;
    border: 0; border-bottom: 1px solid var(--border); background: var(--raised); cursor: pointer; text-align: left;
  }
  .ws-row:hover { background: color-mix(in oklab, var(--fg) 8%, var(--raised)); }
  .ws-row[aria-selected="true"] { box-shadow: inset 3px 0 var(--fg); }
  .ws-row .ico { flex: none; width: 46px; display: grid; place-items: center; color: var(--modified); }
  .ws-row .t { flex: 1; min-width: 0; }
  .ws-row .t1 { font-size: 11.5px; font-weight: 600; }
  .ws-row .t2 { font-size: 10px; color: var(--faint); }
  .ws-row .cnt { font: 10px/1 var(--mono); color: var(--muted); }

  /* 变更树（变更模式下） */
  .cg { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px; color: var(--secondary); font-size: 10.5px; font-weight: 600; border-top: 1px solid var(--border); }
  .cg:first-child { border-top: 0; }
  .cg .n { font: 9.5px/1 var(--mono); color: var(--faint); }
  .cg .m { margin-left: auto; display: flex; gap: 4px; }
  .cg .m button { border: 0; border-radius: 3px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 400; padding: 1px 5px; cursor: pointer; }
  .cg .m button:hover { background: var(--active); color: var(--fg); }
  .frow {
    position: relative; display: flex; align-items: center; gap: 7px; width: 100%; height: 25px;
    padding: 0 12px 0 14px; border: 0; background: transparent; cursor: pointer; text-align: left;
  }
  .frow::before { content: ""; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; }
  .frow[data-k="M"]::before { background: var(--modified); }
  .frow[data-k="A"]::before, .frow[data-k="?"]::before { background: var(--added); }
  .frow[data-k="D"]::before { background: var(--deleted); }
  .frow[data-k="R"]::before { background: var(--renamed); }
  .frow:hover { background: var(--hover); }
  .frow[aria-current="true"] { background: var(--active); }
  .frow .st { flex: none; width: 14px; text-align: center; font: 700 10px/1 var(--mono); }
  .frow[data-k="M"] .st { color: var(--modified); } .frow[data-k="A"] .st, .frow[data-k="?"] .st { color: var(--added); }
  .frow[data-k="D"] .st { color: var(--deleted); } .frow[data-k="R"] .st { color: var(--renamed); }
  .frow .path { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 5px; overflow: hidden; }
  .frow .dir { order: -1; color: var(--faint); font: 10px/1 var(--mono); white-space: nowrap; overflow: hidden; direction: rtl; unicode-bidi: plaintext; }
  .frow .nm { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .dl { flex: none; display: flex; gap: 4px; font: 10px/1 var(--mono); }
  .frow .dl .a { color: var(--added); } .frow .dl .d { color: var(--deleted); }
  .frow .stg { flex: none; width: 18px; height: 18px; display: grid; place-items: center; border: 0; border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer; opacity: 0; }
  .frow:hover .stg { opacity: 1; }
  .frow .stg:hover { background: var(--active); color: var(--fg); }
  .frow:hover .dl { display: none; }

  /* 分支模式 */
  .brow { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 14px; border: 0; background: transparent; cursor: pointer; text-align: left; border-bottom: 1px solid var(--border); }
  .brow:hover { background: var(--hover); }
  .brow[data-cur="true"] { background: var(--active); box-shadow: inset 3px 0 var(--fg); }
  .brow .bn { font-size: 12px; }
  .brow .meta { font-size: 10px; color: var(--faint); }
  .brow .badge { font: 9px/1 var(--mono); padding: 2px 5px; border-radius: 3px; background: var(--active); color: var(--secondary); }
  .brow .tr { margin-left: auto; font: 10px/1 var(--mono); color: var(--faint); }
  .brow .go { margin-left: 8px; }

  /* 分隔条 */
  .splitter { flex: none; height: 6px; background: var(--deep); border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); cursor: row-resize; display: grid; place-items: center; }
  .splitter i { width: 34px; height: 2px; border-radius: 1px; background: var(--faint); opacity: .5; }
  .splitter:hover i { opacity: 1; }

  /* 下半：详情 */
  .detail { flex: 1 1 44%; min-height: 0; display: flex; flex-direction: column; }
  .dhead { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--border); background: var(--raised); }
  .dhead .ttl { font-size: 11.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dhead .meta { font-size: 10px; color: var(--faint); display: flex; gap: 8px; flex-wrap: wrap; }
  .dhead .meta .mono { font-family: var(--mono); }
  .dhead .tools { margin-left: auto; display: flex; gap: 4px; flex: none; }
  .dbody { flex: 1; min-height: 0; display: flex; }
  .dfiles { flex: none; width: 280px; border-right: 1px solid var(--border-strong); overflow: auto; padding-bottom: 8px; }
  .ddiff { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 4px; font: 700 10px/1 var(--mono); }
  .badge.M { color: var(--modified); background: color-mix(in oklab, var(--modified) 17%, transparent); }
  .badge.A { color: var(--added); background: color-mix(in oklab, var(--added) 17%, transparent); }
  .badge.D { color: var(--deleted); background: color-mix(in oklab, var(--deleted) 17%, transparent); }
  .badge.R { color: var(--renamed); background: color-mix(in oklab, var(--renamed) 17%, transparent); }
  .fpath { font: 11.5px/1.35 var(--mono); }
  .fpath .d { color: var(--faint); }
  .nums { display: flex; gap: 6px; font: 10px/1 var(--mono); }
  .nums .a { color: var(--added); } .nums .d { color: var(--deleted); }

  .diff { flex: 1; min-height: 0; overflow: auto; font: 11.5px/1.62 var(--mono); }
  .hunk { position: sticky; top: 0; display: flex; gap: 8px; padding: 3px 12px; background: var(--raised); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 10.5px; }
  .hunk .r { color: var(--renamed); font-variant-numeric: tabular-nums; }
  .hunk .c { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln { display: flex; min-height: 19px; }
  .ln .no { flex: none; width: 36px; padding-right: 8px; text-align: right; color: var(--faint); font-size: 10.5px; user-select: none; }
  .ln .sg { flex: none; width: 13px; text-align: center; color: var(--faint); }
  .ln .cd { flex: 1; padding-right: 14px; color: var(--secondary); white-space: pre-wrap; word-break: break-word; }
  .ln.add { background: var(--wash-add); } .ln.add .cd { color: var(--fg); } .ln.add .sg { color: var(--added); }
  .ln.del { background: var(--wash-del); } .ln.del .sg { color: var(--deleted); }
  .tok { background: var(--tok); border-radius: 2px; }
  .k { color: #c678dd; } .s { color: #98c379; } .n { color: #d19a66; } .cm { color: var(--faint); font-style: italic; }
  :root[data-theme="light"] .k { color: #a626a4; } :root[data-theme="light"] .s { color: #3f8a3a; } :root[data-theme="light"] .n { color: #986801; }
  .intro { padding: 14px 16px; color: var(--muted); font-size: 11.5px; line-height: 1.7; }
  .intro b { color: var(--fg); }
  .intro code { font: 10.5px/1.5 var(--mono); color: var(--secondary); }
  .msgbox { margin: 0 14px 12px; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--raised); font: 11.5px/1.65 var(--mono); color: var(--secondary); white-space: pre-wrap; }

  /* 提交条 */
  .commitbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-top: 1px solid var(--border-strong); background: var(--raised); }
  .commitbar .count { font: 10.5px/1 var(--mono); color: var(--muted); flex: none; }
  .commitbar input {
    flex: 1; min-width: 0; height: 26px; padding: 0 9px; border-radius: 5px;
    border: 1px solid var(--border-strong); background: var(--bg); outline: none; font-size: 11.5px;
  }
  .commitbar input:focus { border-color: color-mix(in oklab, var(--fg) 34%, transparent); }
  .commitbar input::placeholder { color: var(--faint); }
  .primary { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 12px; border: 0; border-radius: 5px; background: var(--fg); color: var(--bg); font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .primary:disabled { background: var(--active); color: var(--faint); cursor: not-allowed; }
  .primary .n { font: 10px/1 var(--mono); opacity: .7; }

  .statusbar { flex: none; height: 22px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--deep); border-top: 1px solid var(--border-strong); color: var(--muted); font-size: 10px; }
  .statusbar .it { display: inline-flex; align-items: center; gap: 4px; }
  .statusbar .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .toast { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 11.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .16s; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h6l2 2h10v12H3z"/></svg> 文件管理器</span>
    <span class="crumb">/ pi-desktop-plugin-file-manager</span>
    <span class="grow"></span>
    <button class="chip" id="pullBtn">Pull <span class="num" id="nBehind">0</span></button>
    <button class="chip" id="pushBtn">Push <span class="num" id="nAhead">3</span></button>
    <button class="icon-btn" id="themeBtn" title="切换亮/暗">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </div>

  <div class="modes" role="tablist" aria-label="视图">
    <button role="tab" type="button" data-mode="history" aria-selected="true">提交图</button>
    <button role="tab" type="button" data-mode="changes" aria-selected="false">变更 <span class="n" id="nChanges">9</span></button>
    <button role="tab" type="button" data-mode="branches" aria-selected="false">分支 <span class="n">4</span></button>
    <span class="hint">拖动中间分隔条调整列表与详情的比例</span>
  </div>

  <div class="list history" id="list"></div>
  <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" aria-label="调整列表高度"><i></i></div>

  <div class="detail">
    <div class="dhead" id="dhead"></div>
    <div class="dbody" id="dbody"></div>
  </div>

  <div class="commitbar">
    <span class="count" id="barCount">已暂存 0</span>
    <input id="msg" placeholder="提交说明（Enter 提交）" aria-label="提交说明">
    <button class="primary" id="commitBtn" disabled>提交 <span class="n" id="commitN">0</span></button>
  </div>

  <div class="statusbar">
    <span class="it"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="5" r="2"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="12" r="2"/><path d="M7 7v10M17 12h-4a6 6 0 0 1-6-6"/></svg><span id="sbBranch">main</span></span>
    <span class="it mono" style="color:var(--faint)" id="sbTrack">origin/main</span>
    <span class="it mono"><span style="color:var(--added)" id="sbAhead">↑3</span> <span style="color:var(--renamed)" id="sbBehind">↓0</span></span>
    <span class="grow"></span>
    <span class="it" id="sbSel"></span>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

  ];

  /* 提交图：每行 34px，主干 x=8，支线 x=26 */
  var ROW = 34, LX = 8, RX = 26;
  function graphSvg(c, i) {
    var svg = '<svg width="62" height="' + ROW + '" viewBox="0 0 62 ' + ROW + '" fill="none">';
    var x = c.lane === 1 ? RX : LX;
    var next = COMMITS[i + 1];
    if (next) {

      else svg += '<path d="M' + x + ',' + (ROW / 2) + ' C' + x + ',' + (ROW * 0.8) + ' ' + nx + ',' + (ROW * 0.2) + ' ' + nx + ',' + ROW + '" stroke="var(--renamed)" stroke-width="1.4" stroke-dasharray="3 2.5"/>';
    }
    if (c.merge && next) {
      svg += '<path d="M' + RX + ',' + (ROW / 2) + ' C' + RX + ',' + (ROW * 0.75) + ' ' + LX + ',' + (ROW * 0.62) + ' ' + LX + ',' + (ROW / 2 + 4) + '" stroke="var(--renamed)" stroke-width="1.4"/>';
    }
    if (i > 0) {
      var prev = COMMITS[i - 1];
      var px = prev.lane === 1 ? RX : LX;
      if (prev.merge) svg += '<path d="M' + RX + ',0 V' + (ROW / 2) + '" stroke="var(--renamed)" stroke-width="1.4"/>';

      : '<circle cx="' + x + '" cy="' + (ROW / 2) + '" r="3.4" fill="' + (c.un ? "var(--modified)" : "var(--modified)") + '"/>';
    return svg + "</svg>";
  }

  function paintList() {

    host.className = "list" + (S.mode === "history" ? " history" : "");
    host.innerHTML = "";

    if (S.mode === "history") {

      var ws = mk("button", "ws-row");
      ws.type = "button";
      ws.setAttribute("aria-selected", String(S.sel.type === "work"));
      var dirty = workPaths().length + untrackedPaths().length;
      ws.innerHTML = '<span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>' +
        '<span class="t"><span class="t1">工作区（未提交）</span><span class="t2">' + stagedPaths().length + " 已暂存 · " + dirty + " 未暂存</span></span>" +
        '<span class="cnt">' + (dirty ? "+" + dirty : "clean") + "</span>";
      ws.addEventListener("click", function () { S.sel = { type: "work" }; paint(); });
      host.appendChild(ws);

      COMMITS.forEach(function (c, i) {
        var row = mk("button", "grow-row");
        row.type = "button";
        row.setAttribute("aria-selected", String(S.sel.type === "commit" && S.sel.sha === c.sha));

  function doCommit() {
    if (!S.msg.trim() || !stagedPaths().length) return;
    var n = stagedPaths().length;
    COMMITS.unshift({ sha: Math.random().toString(16).slice(2, 9), subject: S.msg, author: "Tioit", when: "刚刚", refs: [S.branch], merge: false, un: true, lane: 0, parent: 0, files: stagedPaths() });
    S.staged = {}; S.msg = ""; S.ahead += 1;
    $("#msg").value = "";
    S.mode = "history"; S.sel = { type: "commit", sha: COMMITS[0].sha }; S.file = COMMITS[0].files[0];
    toast("已提交 " + n + " 个文件");
    paint();
  }

      S.ratio = pct;
      $("#list").style.flex = "1 1 " + pct + "%";
      document.querySelector(".detail").style.flex = "1 1 " + (86 - pct) + "%";
    });
    bar.addEventListener("pointerup", function (e) { dragging = false; bar.releasePointerCapture(e.pointerId); });
  })();

  document.querySelectorAll(".modes button[data-mode]").forEach(function (b) {
    b.addEventListener("click", function () {
      S.mode = b.dataset.mode; showMessage = false;
      if (S.mode === "changes") S.sel = { type: "work" };
      if (S.mode === "history") S.sel = { type: "commit", sha: COMMITS[0].sha };
      paint();
    });
  });
  $("#themeBtn").addEventListener("click", function () {
    var d = document.documentElement; d.dataset.theme = d.dataset.theme === "dark" ? "light" : "dark";
  });
  $("#msg").addEventListener("input", function (e) { S.msg = e.target.value; syncBar(); });
  $("#msg").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doCommit(); } });
  $("#commitBtn").addEventListener("click", doCommit);
  $("#pushBtn").addEventListener("click", function () { toast(S.ahead ? "已推送 " + S.ahead + " 个提交" : "没有需要推送的提交"); S.ahead = 0; paint(); });
  $("#pullBtn").addEventListener("click", function () { toast("已是最新（演示不联网）"); });

  paint();
})();
