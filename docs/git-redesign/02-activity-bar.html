<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件管理器 · 活动栏 + 侧边栏（完整演示）</title>
<style>
  /* ── 令牌：与插件 styles/index.css 的宿主镜像变量一致 ── */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #181818; --surface: #181818; --raised: #1f1f1f; --rail: #141414; --deep: #131315;
    --hover: color-mix(in oklab, #ffffff 6%, transparent);
    --active: color-mix(in oklab, #ffffff 10%, transparent);
    --fg: #ffffff;
    --secondary: color-mix(in oklab, #ffffff 70%, transparent);
    --muted: color-mix(in oklab, #ffffff 52%, transparent);
    --faint: color-mix(in oklab, #ffffff 34%, transparent);
    --border: color-mix(in oklab, #ffffff 5%, transparent);
    --border-strong: color-mix(in oklab, #ffffff 14%, transparent);
    --danger: #ff6764;
    --added: #3fb950; --modified: #d29922; --deleted: #f85149; --renamed: #58a6ff; --conflicted: #bc8cff;
    --wash-add: color-mix(in oklab, #3fb950 13%, transparent);
    --wash-del: color-mix(in oklab, #f85149 13%, transparent);
    --tok: color-mix(in oklab, #3fb950 30%, transparent);
    --shadow: 0 10px 34px #0009;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fafafa; --surface: #ffffff; --raised: #f3f3f3; --rail: #f0f0f2; --deep: #ebebee;
    --hover: color-mix(in oklab, #1a1c1f 5%, transparent);
    --active: color-mix(in oklab, #1a1c1f 9%, transparent);
    --fg: #1a1c1f;
    --secondary: color-mix(in oklab, #1a1c1f 74%, transparent);
    --muted: #5d5d5d; --faint: #949494;
    --border: color-mix(in oklab, #1a1c1f 7%, transparent);
    --border-strong: color-mix(in oklab, #1a1c1f 14%, transparent);
    --danger: #e02e2a;
    --added: #1a7f37; --modified: #9a6700; --deleted: #cf222e; --renamed: #0969da; --conflicted: #8250df;
    --wash-add: color-mix(in oklab, #1a7f37 12%, transparent);
    --wash-del: color-mix(in oklab, #cf222e 11%, transparent);
    --tok: color-mix(in oklab, #1a7f37 26%, transparent);
    --shadow: 0 12px 30px #1a1c1f1f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0d0d0f; color: var(--fg); font: 12px/1.45 var(--sans); -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 20px; }
  :root[data-theme="light"] body { background: #e6e6e9; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid color-mix(in oklab, var(--fg) 50%, transparent); outline-offset: 1px; }
  [hidden] { display: none !important; }

  .app {
    position: relative; width: min(1500px, 100%); height: min(920px, calc(100vh - 40px)); min-height: 640px;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 9px; box-shadow: var(--shadow);
  }

  /* ── 顶栏 ── */
  .topbar { flex: none; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--border-strong); }
  .brand { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 11.5px; flex: none; }
  .rootchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 6px; border-radius: 5px; border: 1px solid transparent; background: transparent; color: var(--secondary); font-size: 11px; }
  .rootchip:hover { background: var(--hover); border-color: var(--border); color: var(--fg); }
  .rootchip .mono { font: 10.5px/1 var(--mono); color: var(--faint); }
  .grow { flex: 1; }
  .tbtn { display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--border-strong); background: transparent; color: var(--secondary); font-size: 11px; white-space: nowrap; }
  .tbtn:hover { background: var(--hover); color: var(--fg); }
  .tbtn .n { font: 10px/1 var(--mono); color: var(--fg); }
  .tbtn.primary { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }
  .tbtn.primary:hover { opacity: .9; }
  .tbtn:disabled { opacity: .45; cursor: not-allowed; }
  .ibtn { display: grid; place-items: center; width: 26px; height: 26px; flex: none; border: 0; border-radius: 5px; background: transparent; color: var(--secondary); }
  .ibtn:hover { background: var(--hover); color: var(--fg); }
  .ibtn[aria-pressed="true"] { background: var(--active); color: var(--fg); }
  .sep { width: 1px; height: 17px; background: var(--border-strong); flex: none; }

  /* ── 活动栏 ── */
  .body { flex: 1; min-height: 0; display: flex; }
  .rail { flex: none; width: 46px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0; background: var(--rail); border-right: 1px solid var(--border-strong); }
  .rail .rb { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--faint); }
  .rail .rb:hover { color: var(--fg); background: var(--hover); }
  .rail .rb[aria-selected="true"] { color: var(--fg); }
  .rail .rb[aria-selected="true"]::before { content: ""; position: absolute; left: -5px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--fg); }
  .rail .rb .badge { position: absolute; right: 3px; top: 3px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--modified); color: #1a1c1f; font: 700 8.5px/14px var(--mono); text-align: center; }
  .rail .sp { flex: 1; }

  /* ── 侧边栏 ── */
  .side { flex: none; width: 300px; min-width: 200px; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border-strong); position: relative; }
  .side-head { flex: none; height: 32px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--border); }
  .side-head .t { color: var(--muted); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-head .acts { display: flex; gap: 1px; flex: none; }
  .side-head .acts .ibtn { width: 22px; height: 22px; }
  .side-body { flex: 1; min-height: 0; overflow: auto; padding: 3px 5px 8px; }
  .side-foot { flex: none; border-top: 1px solid var(--border-strong); padding: 7px; }
  .gutter { flex: none; width: 4px; cursor: col-resize; background: transparent; }
  .gutter:hover { background: var(--border-strong); }

  .srch { display: flex; align-items: center; gap: 5px; margin: 5px 6px 4px; padding: 0 7px; height: 24px; border-radius: 5px; border: 1px solid var(--border-strong); background: var(--bg); }
  .srch input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 11px; }
  .srch input::placeholder { color: var(--faint); }

  .trow {
    display: flex; align-items: center; gap: 4px; width: 100%; height: 23px; padding: 0 5px 0 3px;
    border: 0; border-radius: 4px; background: transparent; color: var(--secondary); font-size: 11.5px; text-align: left; white-space: nowrap;
  }
  .trow:hover { background: var(--hover); color: var(--fg); }
  .trow[data-sel="true"] { background: var(--active); color: var(--fg); }
  .trow .car { width: 12px; flex: none; color: var(--faint); display: grid; place-items: center; }
  .trow .ico { flex: none; width: 14px; display: grid; place-items: center; }
  .trow .nm { overflow: hidden; text-overflow: ellipsis; }
  .trow .gb { margin-left: auto; flex: none; font: 700 9.5px/1 var(--mono); }
  .trow .gb.M { color: var(--modified); } .trow .gb.A, .trow .gb\? { color: var(--added); }
  .trow .gb.D { color: var(--deleted); } .trow .gb.R { color: var(--renamed); }
  .trow.ignored { opacity: .45; }
  .empty-hint { padding: 14px 10px; color: var(--faint); font-size: 11px; line-height: 1.7; }

  /* 变更列表 */
  .grp { display: flex; align-items: center; gap: 6px; height: 25px; padding: 0 4px; color: var(--secondary); font-size: 10.5px; font-weight: 600; }
  .grp .n { font: 9.5px/1 var(--mono); color: var(--faint); }
  .grp .all { margin-left: auto; display: flex; gap: 1px; }
  .grp .all button { width: 19px; height: 19px; display: grid; place-items: center; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font-size: 11px; }
  .grp .all button:hover { background: var(--active); color: var(--fg); }
  .frow {
    position: relative; display: flex; align-items: center; gap: 6px; width: 100%; min-height: 25px; padding: 0 4px;
    border: 0; border-radius: 4px; background: transparent; text-align: left;
  }
  .frow::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; }
  .frow[data-k="M"]::before { background: var(--modified); }
  .frow[data-k="A"]::before, .frow[data-k="?"]::before { background: var(--added); }
  .frow[data-k="D"]::before { background: var(--deleted); }
  .frow[data-k="R"]::before { background: var(--renamed); }
  .frow:hover { background: var(--hover); }
  .frow[data-sel="true"] { background: var(--active); }
  .frow .st { flex: none; width: 14px; text-align: center; font: 700 10px/1 var(--mono); }
  .frow[data-k="M"] .st { color: var(--modified); } .frow[data-k="A"] .st, .frow[data-k="?"] .st { color: var(--added); }
  .frow[data-k="D"] .st { color: var(--deleted); } .frow[data-k="R"] .st { color: var(--renamed); }
  .frow .lbl { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px; overflow: hidden; }
  .frow .dir { order: -1; color: var(--faint); font: 9.5px/1 var(--mono); white-space: nowrap; overflow: hidden; direction: rtl; unicode-bidi: plaintext; }
  .frow .nm { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frow .dl { flex: none; display: flex; gap: 3px; font: 9.5px/1 var(--mono); }
  .frow .dl .a { color: var(--added); } .frow .dl .d { color: var(--deleted); }
  .frow .act { flex: none; width: 17px; height: 17px; display: grid; place-items: center; border: 0; border-radius: 3px; background: transparent; color: var(--muted); opacity: 0; }
  .frow:hover .act { opacity: 1; } .frow:hover .dl { display: none; }
  .frow .act:hover { background: var(--active); color: var(--fg); }

  /* 历史 / 分支 */
  .cit { display: flex; gap: 6px; width: 100%; padding: 4px 5px; border: 0; border-radius: 4px; background: transparent; text-align: left; }
  .cit:hover { background: var(--hover); }
  .cit[data-sel="true"] { background: var(--active); }
  .cit .g { flex: none; width: 12px; padding-top: 3px; }
  .cit .g i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--modified); }
  .cit[data-merge="true"] .g i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--renamed); }
  .cit .t { flex: 1; min-width: 0; }
  .cit .s { display: block; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cit .m { display: flex; gap: 5px; color: var(--faint); font-size: 9.5px; align-items: center; }
  .ref { height: 13px; padding: 0 3px; border-radius: 3px; display: inline-flex; align-items: center; font: 8.5px/1 var(--mono); border: 1px solid var(--border-strong); color: var(--muted); flex: none; }
  .ref.remote { color: var(--renamed); border-color: color-mix(in oklab, var(--renamed) 40%, transparent); }
  .ref.tag { color: var(--modified); border-color: color-mix(in oklab, var(--modified) 40%, transparent); }
  .ref.local { color: var(--fg); border-color: color-mix(in oklab, var(--fg) 34%, transparent); }
  .bit { display: flex; align-items: center; gap: 7px; width: 100%; padding: 5px 6px; border: 0; border-radius: 4px; background: transparent; text-align: left; }
  .bit:hover { background: var(--hover); }
  .bit[data-cur="true"] { background: var(--active); }
  .bit .nm { font-size: 11.5px; }
  .bit .tag { font: 8.5px/1 var(--mono); padding: 2px 4px; border-radius: 3px; background: var(--active); color: var(--secondary); }
  .bit .tr { margin-left: auto; font: 9.5px/1 var(--mono); color: var(--faint); }

  /* 提交框 */
  .composer { border: 1px solid var(--border-strong); border-radius: 6px; background: var(--bg); overflow: hidden; }
  .composer:focus-within { border-color: color-mix(in oklab, var(--fg) 34%, transparent); }
  .composer textarea { display: block; width: 100%; min-height: 52px; max-height: 120px; resize: vertical; border: 0; outline: none; background: transparent; padding: 7px 8px 3px; font: 12px/1.5 var(--sans); }
  .composer textarea::placeholder { color: var(--faint); }
  .cbar { display: flex; align-items: center; gap: 5px; padding: 4px 5px 5px 8px; border-top: 1px solid var(--border); }
  .cbar .h { font-size: 10px; color: var(--faint); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbar .go { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border: 0; border-radius: 5px; background: var(--fg); color: var(--bg); font-size: 11.5px; font-weight: 600; }
  .cbar .go:disabled { background: var(--active); color: var(--faint); cursor: not-allowed; }
  .cbar .go .n { font: 10px/1 var(--mono); opacity: .7; }
  .hook { display: flex; gap: 5px; align-items: flex-start; margin-top: 6px; padding: 4px 6px; border-radius: 4px; background: color-mix(in oklab, var(--modified) 14%, transparent); color: var(--modified); font-size: 10px; line-height: 1.5; }

  /* ── 内容区 ── */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .tabs { flex: none; height: 33px; display: flex; align-items: stretch; gap: 1px; padding: 4px 6px 0; background: var(--raised); border-bottom: 1px solid var(--border-strong); overflow-x: auto; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 9px; border: 0; border-radius: 5px 5px 0 0; background: transparent; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .tab:hover { background: var(--hover); color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: inset 0 2px 0 var(--secondary); }
  .tab .dirty { width: 5px; height: 5px; border-radius: 50%; background: var(--modified); flex: none; }
  .tab .x { width: 15px; height: 15px; display: grid; place-items: center; border: 0; border-radius: 3px; background: transparent; color: var(--faint); font-size: 12px; }
  .tab .x:hover { background: var(--active); color: var(--fg); }

  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .toolbar2 { flex: none; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-bottom: 1px solid var(--border); }
  .toolbar2 .path { font: 11.5px/1.3 var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar2 .path .d { color: var(--faint); }
  .toolbar2 .sp { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 6px; background: var(--hover); }
  .seg button { border: 0; border-radius: 4px; background: transparent; padding: 3px 8px; color: var(--muted); font-size: 10.5px; display: inline-flex; gap: 4px; align-items: center; }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-selected="true"] { background: var(--raised); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-strong); }
  .seg .n { font: 9px/1 var(--mono); color: var(--faint); }
  .meta { color: var(--faint); font-size: 10.5px; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 4px; font: 700 10px/1 var(--mono); flex: none; }
  .badge.M { color: var(--modified); background: color-mix(in oklab, var(--modified) 17%, transparent); }
  .badge.A { color: var(--added); background: color-mix(in oklab, var(--added) 17%, transparent); }
  .badge.D { color: var(--deleted); background: color-mix(in oklab, var(--deleted) 17%, transparent); }
  .badge.R { color: var(--renamed); background: color-mix(in oklab, var(--renamed) 17%, transparent); }
  .nums { display: flex; gap: 6px; font: 10.5px/1 var(--mono); }
  .nums .a { color: var(--added); } .nums .d { color: var(--deleted); }

  /* 代码编辑器 */
  .editor { flex: 1; min-height: 0; display: flex; overflow: hidden; font: 12px/1.6 var(--mono); }
  .editwrap { flex: 1; min-width: 0; overflow: auto; display: flex; }
  .gutter2 { flex: none; padding: 6px 8px 6px 10px; text-align: right; color: var(--faint); font-size: 11px; user-select: none; background: var(--bg); position: sticky; left: 0; }
  .gutter2 div { height: 19.2px; }
  .codewrap { flex: 1; min-width: 0; position: relative; }
  .codewrap pre, .codewrap textarea {
    margin: 0; padding: 6px 12px; font: 12px/1.6 var(--mono); white-space: pre; tab-size: 2;
    border: 0; letter-spacing: 0; word-spacing: 0;
  }
  .codewrap pre { pointer-events: none; color: var(--secondary); }
  .codewrap textarea {
    position: absolute; inset: 0; width: 100%; height: 100%; resize: none; outline: none;
    background: transparent; color: transparent; caret-color: var(--fg); overflow: hidden;
  }
  .codewrap textarea::selection { background: color-mix(in oklab, var(--fg) 24%, transparent); }
  .k { color: #c678dd; } .s { color: #98c379; } .n { color: #d19a66; } .cm { color: var(--faint); font-style: italic; } .fn { color: #61afef; }
  :root[data-theme="light"] .k { color: #a626a4; } :root[data-theme="light"] .s { color: #3f8a3a; } :root[data-theme="light"] .n { color: #986801; } :root[data-theme="light"] .fn { color: #0b6fb8; }

  /* diff */
  .diff { flex: 1; min-height: 0; overflow: auto; font: 11.5px/1.62 var(--mono); }
  .hunk { position: sticky; top: 0; display: flex; gap: 8px; padding: 3px 12px; background: var(--raised); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 10.5px; }
  .hunk .r { color: var(--renamed); font-variant-numeric: tabular-nums; }
  .hunk .c { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ln { display: flex; min-height: 19px; }
  .ln .no { flex: none; width: 38px; padding-right: 8px; text-align: right; color: var(--faint); font-size: 10.5px; user-select: none; }
  .ln .sg { flex: none; width: 13px; text-align: center; color: var(--faint); }
  .ln .cd { flex: 1; padding-right: 14px; color: var(--secondary); white-space: pre-wrap; word-break: break-word; }
  .ln.add { background: var(--wash-add); } .ln.add .cd { color: var(--fg); } .ln.add .sg { color: var(--added); }
  .ln.del { background: var(--wash-del); } .ln.del .sg { color: var(--deleted); }
  .tok { background: var(--tok); border-radius: 2px; }

  /* Markdown */
  .md { flex: 1; min-height: 0; overflow: auto; padding: 20px 26px 40px; }
  .md h1, .md h2, .md h3 { margin: 1.1em 0 .5em; line-height: 1.3; }
  .md h1 { font-size: 21px; } .md h2 { font-size: 16px; border-bottom: 1px solid var(--border-strong); padding-bottom: 5px; }
  .md h3 { font-size: 13.5px; } .md p, .md li { color: var(--secondary); line-height: 1.75; }
  .md code { font: 11.5px/1.5 var(--mono); background: var(--raised); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow: auto; }
  .md pre code { background: none; border: 0; padding: 0; }
  .md table { border-collapse: collapse; margin: 12px 0; font-size: 11.5px; }
  .md th, .md td { border: 1px solid var(--border-strong); padding: 5px 10px; text-align: left; }
  .md th { background: var(--raised); font-weight: 600; }
  .md blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--border-strong); color: var(--muted); }
  .md a { color: var(--renamed); }

  /* 图片 / 二进制 */
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; background: repeating-conic-gradient(var(--raised) 0% 25%, transparent 0% 50%) 50%/16px 16px; }
  .stagebox { text-align: center; display: grid; gap: 8px; justify-items: center; }
  .stagebox .cap { font: 10.5px/1.6 var(--mono); color: var(--muted); background: var(--bg); padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border-strong); }

  /* CSV 表格 */
  .tablewrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tableview { flex: 1; min-height: 0; overflow: auto; }
  .tableview table { border-collapse: collapse; font: 11.5px/1.5 var(--mono); width: 100%; }
  .tableview th, .tableview td { border: 1px solid var(--border); padding: 4px 9px; text-align: left; white-space: nowrap; }

    "src/lib/git.ts": "import { parentOf } from \"./format\";\nimport type { GitEntryStatus, GitStatusKind } from \"./rpc\";\n\n/** 徽标字母：与 git 那套心智模型一致（M/A/D/R/U） */\nconst GLYPH: Record<GitStatusKind, string> = {\n  added: \"A\",\n  modified: \"M\",\n  deleted: \"D\",\n  renamed: \"R\",\n  conflicted: \"U\",\n  typechange: \"T\",\n};\n\nexport function gitGlyph(status: GitStatusKind): string {\n  return GLYPH[status] ?? \"?\";\n}\n\n/** 一行的状态说明：状态名 + 暂存 / 未跟踪 + 增删行数 */\nexport function gitTitle(git: GitEntryStatus, t: T): string {\n  const parts = [t(STATUS_KEY[git.status])];\n  if (git.untracked) parts.push(t(\"gitUntracked\"));\n  else if (git.staged) parts.push(t(\"gitStaged\"));\n  return parts.join(\" · \");\n}\n",

    "README.md": "# 文件管理器\n\n浏览、预览与编辑项目文件，并在同一面板里完成 Git 管理。\n\n## 功能\n\n- **完整目录树**：懒加载、可按层展开、目录在前，每行按文件类型显示图标与 Git 徽标。\n- **多文件标签**：右侧可同时打开多个文档，同一路径再次打开会定位已有标签。\n- **代码高亮编辑**：`Ctrl/Cmd+S` 保存；没有改动时不写盘。\n- **Git 管理**：变更分组、暂存、提交、提交图与提交详情、分支切换、远程同步。\n- **多种预览**：Markdown、图片、CSV 表格、JSON 折叠树、PDF、音视频。\n\n## 快捷键\n\n| 按键 | 动作 |\n| --- | --- |\n| `Ctrl+Shift+E` | 资源管理器 |\n| `Ctrl+Shift+F` | 搜索 |\n| `Ctrl+Shift+G` | 源代码管理 |\n| `Ctrl+S` | 保存当前文件 |\n| `Ctrl+W` | 关闭当前标签 |\n",

  function doCommit() {

  /* ══════════ 标签与内容 ══════════ */

  function kindOf(path) {
    if (/\.(png|jpe?g|gif|webp|avif|bmp|ico|svg)$/i.test(path)) return "image";

    if (/\.(csv|tsv)$/i.test(path)) return "table";

  /* 代码编辑器（高亮 + 可编辑 + 脏标记 + 保存） */
  var KW = ["import", "from", "export", "const", "let", "var", "function", "return", "if", "else", "for", "while", "new", "class", "extends", "type", "interface", "async", "await", "true", "false", "null", "undefined", "typeof", "of", "in", "switch", "case", "break", "default", "throw", "try", "catch"];
  /**
   * 极简分词器：逐字符扫描一次，识别字符串 / 行注释 / 单词 / 数字，
   * 产出的片段已按类型包裹，不会再把生成的 <span class="s"> 自身当成标识符二次包裹。
   * 只为演示高亮，不追求完整语法。
   */
  function highlight(text, path) {
    var json = ext(path) === "json";
    var out = "";
    var i = 0, n = text.length;
    while (i < n) {
      var ch = text[i];
      // 行注释
      if (ch === "/" && text[i + 1] === "/" && !json) {
        var e1 = text.indexOf("\n", i);
        if (e1 < 0) e1 = n;
        out += '<span class="cm">' + esc(text.slice(i, e1)) + "</span>";
        i = e1;
        continue;
      }
      // 字符串（" ' `）
      if (ch === '"' || ch === "'" || ch === "`") {
        var q = ch, j = i + 1;
        while (j < n && text[j] !== q) { if (text[j] === "\\") j++; j++; }
        j = Math.min(j + 1, n);
        out += '<span class="s">' + esc(text.slice(i, j)) + "</span>";
        i = j;
        continue;
      }
      // 数字
      if (/[0-9]/.test(ch)) {
        var k = i;
        while (k < n && /[0-9.]/.test(text[k])) k++;
        out += '<span class="n">' + esc(text.slice(i, k)) + "</span>";
        i = k;
        continue;
      }
      // 单词
      if (/[A-Za-z_$]/.test(ch)) {
        var w = i;
        while (w < n && /[A-Za-z0-9_$]/.test(text[w])) w++;
        var word = text.slice(i, w);
        var after = text.slice(w).match(/^\s*\(/);
        if (KW.indexOf(word) >= 0) out += '<span class="k">' + esc(word) + "</span>";
        else if (after) out += '<span class="fn">' + esc(word) + "</span>";
        else out += esc(word);
        i = w;
        continue;
      }
      out += esc(ch);
      i++;
    }
    return out;
  }
  function codeView(path) {
    var wrap = el("div", "editor");
    var outer = el("div", "editwrap");
    var text = S.content[path] != null ? S.content[path] : "";
    var lines = text.split("\n");
    var gut = el("div", "gutter2");
    var pre = el("pre");
    var ta = el("textarea");
    ta.value = text;
    ta.spellcheck = false;
    ta.setAttribute("aria-label", path);
    function repaint() {
      gut.innerHTML = lines.map(function (_, i) { return "<div>" + (i + 1) + "</div>"; }).join("");
      pre.innerHTML = highlight(ta.value, path) || " ";
    }
    repaint();
    ta.addEventListener("input", function () {
      S.content[path] = ta.value;
      S.dirty[path] = true;
      lines = ta.value.split("\n");
      repaint();
      paintTabs();
      paintStatusPos(ta);
    });
    ta.addEventListener("keydown", function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveFile(path); }
      if (e.key === "Tab") {
        e.preventDefault();
        var st = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, st) + "  " + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = st + 2;
        ta.dispatchEvent(new Event("input"));
      }
    });
    ta.addEventListener("click", function () { paintStatusPos(ta); });
    ta.addEventListener("keyup", function () { paintStatusPos(ta); });
    ta.addEventListener("scroll", function () { pre.style.transform = "translateY(" + (-ta.scrollTop) + "px)"; });
    var cw = el("div", "codewrap"); cw.appendChild(pre); cw.appendChild(ta);
    outer.appendChild(gut); outer.appendChild(cw);
    wrap.appendChild(outer);
    setTimeout(function () { paintStatusPos(ta); ta.focus(); }, 0);
    return wrap;
  }
  function paintStatusPos(ta) {
    var upto = ta.value.slice(0, ta.selectionStart).split("\n");
    $("#sbPos").textContent = "行 " + upto.length + "，列 " + (upto[upto.length - 1].length + 1);
  }
  function saveFile(path) {
    if (!S.dirty[path]) { toast("没有改动，未写盘"); return; }
    S.dirty[path] = false;
    var m = GIT[path];
    if (m && m.k === "?") { /* 新建文件保存后进入未跟踪 */ }
    else if (!m) { GIT[path] = { k: "M", a: 3, d: 1, staged: false }; }
    toast("已保存 " + base(path));
    paintAll();
  }

  /* Markdown 预览 */
  function markdownView(path) {
    var box = el("div", "md");
    box.innerHTML = md(S.content[path] || "");
    return box;
  }
  function md(src) {
    var h = esc(src);
    h = h.replace(/```([a-z]*)\n([\s\S]*?)```/g, function (_, lang, code) { return "<pre><code>" + code + "</code></pre>"; });
    h = h.replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>");
    // 表格：先把连续的 |行| 收集成一个块，第一行作表头，第二行作对齐分隔，其余作正文
    h = h.replace(/(?:^\|.*\|\s*$\n?){2,}/gm, function (block) {
      var rows = block.trim().split("\n").filter(function (r) { return r.trim(); });
      if (rows.length < 2) return block;
      var cellsOf = function (r) { return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); }); };
      var head = cellsOf(rows[0]);
      var bodyRows = rows.slice(1).filter(function (r) { return !cellsOf(r).every(function (c) { return /^:?-{2,}:?$/.test(c); }); });
      return "<table><thead><tr>" + head.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead><tbody>" +
        bodyRows.map(function (r) { return "<tr>" + cellsOf(r).map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") +
        "</tbody></table>\n";
    });
    h = h.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
    h = h.replace(/^- (.*)$/gm, "<li>$1</li>");
    h = h.replace(/(<li>[\s\S]*?<\/li>)(?=\n(?!<li>))/g, "<ul>$1</ul>");
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="#">$1</a>');
    h = h.split("\n").map(function (line) {
      if (/^\s*$/.test(line) || /^<(h\d|ul|pre|table|blockquote)/.test(line) || /^<\/?(ul|li)/.test(line)) return line;
      if (/^\s*<tr|^\s*<\/?(table|thead|tbody)/.test(line)) return line;
      return "<p>" + line + "</p>";
    }).join("\n");
    return h;
  }

  /* CSV 表格 */
  function tableView(path) {
    var wrap = el("div", "tablewrap");
    var raw = (S.content[path] || "").trim().split("\n").map(function (l) { return l.split(","); });
    var head = raw[0], rows = raw.slice(1);
    var pageSize = 5;
    var page = Math.min(S.csvPage, Math.max(0, Math.ceil(rows.length / pageSize) - 1));
    var start = page * pageSize;
    var view = el("div", "tableview");
    var html = "<table><thead><tr><th class='rn'>#</th>" + head.map(function (h2) { return "<th>" + esc(h2) + "</th>"; }).join("") + "</tr></thead><tbody>";
    rows.slice(start, start + pageSize).forEach(function (r, i) {
      html += "<tr><td class='rn'>" + (start + i + 1) + "</td>" + r.map(function (c) {
        var num = /^-?\d+(\.\d+)?$/.test(c.trim());
        return "<td class='" + (num ? "num" : "") + "'>" + esc(c) + "</td>";
      }).join("") + "</tr>";
    });
    html += "</tbody></table>";
    view.innerHTML = html;
    wrap.appendChild(view);
    var total = Math.ceil(rows.length / pageSize);
    var pager = el("div", "pager");
    pager.innerHTML = "<span>第 " + (start + 1) + "–" + Math.min(start + pageSize, rows.length) + " 行 / 共 " + rows.length + " 行</span>" +
      '<span class="pg"><button type="button" data-p="first">«</button><button type="button" data-p="prev">‹</button><button type="button" data-p="next">›</button><button type="button" data-p="last">»</button></span>';
    pager.querySelector('[data-p="first"]').disabled = page === 0;
    pager.querySelector('[data-p="prev"]').disabled = page === 0;
    pager.querySelector('[data-p="next"]').disabled = page >= total - 1;
    pager.querySelector('[data-p="last"]').disabled = page >= total - 1;
    pager.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var p = btn.dataset.p;
        S.csvPage = p === "first" ? 0 : p === "prev" ? page - 1 : p === "next" ? page + 1 : total - 1;
        paintContent();
      });
    });
    wrap.appendChild(pager);
    return wrap;
  }

  /* JSON 树 */
  function jsonView(path) {
    var box = el("div", "jt");
    var data;
    try { data = JSON.parse(S.content[path] || "{}"); }
    catch (e) { box.innerHTML = '<p style="color:var(--danger)">解析失败：' + esc(e.message) + "</p>"; return box; }
    function node(key, val, depth, pathKey) {
      var row = el("div");
      var isObj = val && typeof val === "object";
      var openKey = pathKey;
      var isOpen = S.jsonOpen[openKey] !== false && depth < 2;
      if (isObj) {
        var arr = Array.isArray(val);
        var count = arr ? val.length : Object.keys(val).length;
        var head = el("div", "row2");
        head.innerHTML = '<span class="tg">' + (isOpen ? "▾" : "▸") + "</span>" +
          (key ? '<span class="jk">' + esc(key) + "</span><span class='jn'>:</span>" : "") +
          "<span class='jn'>" + (arr ? "[" : "{") + '</span><span class="count">' + count + (arr ? " 项" : " 键") + "</span>";
        head.querySelector(".tg").addEventListener("click", function () { S.jsonOpen[openKey] = !isOpen; paintContent(); });
        row.appendChild(head);
        if (isOpen) {
          var kids = el("div", "kids");
          (arr ? val : Object.keys(val)).forEach(function (k, i) { kids.appendChild(node(arr ? String(i) : k, val[k], depth + 1, openKey + "/" + (arr ? i : k))); });
          row.appendChild(kids);
        }
      } else {
        var cls = typeof val === "string" ? "js" : typeof val === "number" ? "jnum" : "jl";
        var shown = typeof val === "string" ? '"' + esc(val) + '"' : esc(String(val));
        row.innerHTML = '<div class="row2"><span class="tg"></span>' + (key ? '<span class="jk">' + esc(key) + '</span><span class="jn">:</span>' : "") + '<span class="' + cls + '">' + shown + "</span></div>";
      }
      return row;
    }
    if (data && typeof data === "object") {
      (Array.isArray(data) ? data.map(function (_, i) { return String(i); }) : Object.keys(data)).forEach(function (k) {
        box.appendChild(node(Array.isArray(data) ? k : k, data[k], 0, k));
      });
    } else box.appendChild(el("div", "jt", esc(String(data))));
    return box;
  }

  /* 差异视图 */
  function paintDiffView(host, path) {
    var m = GIT[path] || { k: "M", a: 12, d: 4 };
    var b = bits(path);
    var bar = el("div", "toolbar2");
    bar.innerHTML = '<span class="badge ' + m.k + '">' + (m.k === "?" ? "??" : m.k) + "</span>" +
      '<span class="path"><span class="d">' + esc(b.d) + "</span>" + esc(b.n) + "</span>" +
      '<span class="nums"><span class="a">+' + (m.a || 0) + '</span><span class="d">−' + (m.d || 0) + "</span></span>";
    var seg = el("div", "seg");
    seg.innerHTML = '<button type="button" data-s="worktree" aria-selected="' + (S.diffScope !== "staged") + '">未暂存</button><button type="button" data-s="staged" aria-selected="' + (S.diffScope === "staged") + '">已暂存</button>';
    seg.querySelectorAll("button").forEach(function (x) {
      x.addEventListener("click", function () { S.diffScope = x.dataset.s; paintContent(); });
    });
    bar.appendChild(seg);
    var sp = el("span", "sp"); bar.appendChild(sp);
    var mm = el("span", "meta"); mm.textContent = S.diffScope === "staged" ? "HEAD → 暂存区" : "暂存区 → 磁盘"; bar.appendChild(mm);
    host.appendChild(bar);

    var d = el("div", "diff");
    DIFF.forEach(function (h) {
      d.appendChild(el("div", "hunk", '<span class="r">' + esc(h.h.split(" ")[0]) + '</span><span class="c">' + esc(h.h.replace(/^@@\s*\S+\s*\S+\s*@@\s*/, "")) + "</span>"));
      h.lines.forEach(function (l) {
        var sign = typeof l[0] === "string" ? l[0].charAt(0) : (l[0] < 0 ? "-" : " ");
        var no = typeof l[0] === "string" ? l[0].slice(1) : String(l[0]);
        var cls = "ln" + (sign === "+" ? " add" : sign === "-" ? " del" : "");
        d.appendChild(el("div", cls, '<span class="no">' + no + '</span><span class="sg">' + (sign === " " ? " " : sign) + '</span><span class="cd">' + l[1] + "</span>"));
      });
    });
    host.appendChild(d);
    $("#sbKind").textContent = "差异";
    $("#sbPos").textContent = "—";
  }

  /* 提交检视 */
  function paintCommitView(host, sha) {
    var c = COMMITS.filter(function (x) { return x.sha === sha; })[0];
    if (!c) { host.appendChild(emptyState()); return; }
    var bar = el("div", "toolbar2");
    bar.innerHTML = '<span class="badge R">' + (c.merge ? "M" : "C") + "</span>" +
      '<span class="path">' + esc(c.subject) + "</span>" +
      '<span class="meta">' + esc(c.author) + " · " + esc(c.when) + " · <span style=\"font-family:var(--mono)\">" + c.sha + "</span>" +
      (c.un ? ' · <span style="color:var(--modified)">未推送</span>' : ' · <span style="color:var(--added)">已同步</span>') + "</span>";
    var sp = el("span", "sp"); bar.appendChild(sp);
    var copy = el("button", "tbtn", "复制 SHA");
    copy.addEventListener("click", function () { toast("已复制 " + c.sha); });
    bar.appendChild(copy);
    host.appendChild(bar);

    var body = el("div"); body.style.cssText = "flex:1;min-height:0;display:flex";
    var files = el("div"); files.style.cssText = "flex:none;width:250px;border-right:1px solid var(--border-strong);overflow:auto;padding:4px 5px";
    files.appendChild(el("div", "grp", "<span>本次提交的文件</span><span class='n'>" + c.files.length + "</span>"));
    c.files.forEach(function (p, i) {
      var m = GIT[p] || { k: "M", a: 9, d: 4 }, b = bits(p);
      var row = el("button", "frow");
      row.type = "button"; row.dataset.k = m.k; row.dataset.sel = String(i === 0);
      row.innerHTML = '<span class="st">' + m.k + '</span><span class="lbl"><span class="dir">' + esc(b.d || "—") + '</span><span class="nm">' + esc(b.n) + '</span></span><span class="dl"><span class="a">+' + m.a + "</span><span class='d'>−" + m.d + "</span></span>";
      files.appendChild(row);
    });
    body.appendChild(files);
    var right = el("div"); right.style.cssText = "flex:1;min-width:0;display:flex;flex-direction:column";
    var sub = el("div", "toolbar2"); sub.innerHTML = '<span class="meta">与父提交 ' + (c.merge ? "合并两个父提交" : "c81d4a2") + " 比较</span>";
    right.appendChild(sub);
    var d = el("div", "diff");
    DIFF.forEach(function (h) {
      d.appendChild(el("div", "hunk", '<span class="r">' + esc(h.h.split(" ")[0]) + '</span><span class="c">' + esc(h.h.replace(/^@@\s*\S+\s*\S+\s*@@\s*/, "")) + "</span>"));
      h.lines.forEach(function (l) {
        var sign = typeof l[0] === "string" ? l[0].charAt(0) : (l[0] < 0 ? "-" : " ");
        var no = typeof l[0] === "string" ? l[0].slice(1) : String(l[0]);
        d.appendChild(el("div", "ln" + (sign === "+" ? " add" : sign === "-" ? " del" : ""), '<span class="no">' + no + '</span><span class="sg">' + (sign === " " ? " " : sign) + '</span><span class="cd">' + l[1] + "</span>"));
      });
    });
    right.appendChild(d);
    body.appendChild(right);
    host.appendChild(body);
    $("#sbKind").textContent = "提交检视";
    $("#sbPos").textContent = "—";
  }

  /* ══════════ 右键菜单 ══════════ */
  var menuEl = null;
  function showMenu(x, y, items) {
    closeMenu();
    var m = el("div", "menu");
    items.forEach(function (it) {
      if (it === "-") { m.appendChild(el("hr")); return; }
      var b = el("button", it.danger ? "danger" : "");
      b.type = "button";
      b.innerHTML = "<span>" + esc(it.label) + "</span>" + (it.key ? '<span class="sc">' + esc(it.key) + "</span>" : "");
      b.addEventListener("click", function () { closeMenu(); it.run(); });
      m.appendChild(b);
    });
    document.body.appendChild(m);
    var r = m.getBoundingClientRect();
    m.style.left = Math.min(x, window.innerWidth - r.width - 8) + "px";
    m.style.top = Math.min(y, window.innerHeight - r.height - 8) + "px";
    menuEl = m;
    setTimeout(function () {
      document.addEventListener("pointerdown", onDocDown, true);
    }, 0);
  }
  function onDocDown(e) { if (menuEl && !menuEl.contains(e.target)) closeMenu(); }
  function closeMenu() {
    if (menuEl) { menuEl.remove(); menuEl = null; }
    document.removeEventListener("pointerdown", onDocDown, true);
  }
  function fileMenu(path) {
    return [
      { label: "打开", key: "Enter", run: function () { openFile(path); } },
      { label: "查看差异", run: function () { openDiff(path); } },
      { label: "在编辑器中打开", run: function () { openFile(path); toast("已在内容区打开"); } },
      "-",
      { label: "复制相对路径", run: function () { toast("已复制 " + path); } },
      { label: "复制绝对路径", run: function () { toast("已复制 ~/" + path); } },
      "-",
      { label: "重命名…", run: function () { renameEntry(path); } },
      { label: "用默认应用打开", run: function () { toast("已交给系统默认应用：" + base(path)); } },
      { label: "在文件夹中显示", run: function () { toast("已在文件管理器中定位"); } },
      "-",
      { label: "删除", danger: true, key: "Del", run: function () { removeEntry(path); } }
    ];
  }
  function dirMenu(path) {
    return [
      { label: "新建文件…", run: function () { S.selected = path; createEntry(false); } },
      { label: "新建文件夹…", run: function () { S.selected = path; createEntry(true); } },
      "-",
      { label: "复制相对路径", run: function () { toast("已复制 " + path); } },
      { label: "全部展开", run: function () { expandAll(path); } },
      "-",
      { label: "删除文件夹", danger: true, run: function () { removeEntry(path); } }
    ];
  }
  function expandAll(p) {
    var exp = S.root === "main" ? S.expanded : S.expandedDocs;
    (function walk(d) { exp[d] = true; listDir(d).forEach(function (it) { if (it[1] === "dir") walk(d ? d + "/" + it[0] : it[0]); }); })(p);
    paintSide();
  }
  function renameEntry(path) {
    prompt2("重命名", "输入新名称", base(path), function (name) {
      if (!name || name === base(path)) return;
      var dir = bits(path).d.replace(/\/$/, "");
      var items = listDir(dir);
      items.forEach(function (it) { if ((dir ? dir + "/" + it[0] : it[0]) === path) it[0] = name; });
      if (S.content[path] != null) { S.content[(dir ? dir + "/" : "") + name] = S.content[path]; delete S.content[path]; }
      if (GIT[path]) { GIT[(dir ? dir + "/" : "") + name] = GIT[path]; delete GIT[path]; }
      S.tabs = S.tabs.map(function (t) { return t === path ? (dir ? dir + "/" : "") + name : t; });
      S.active = (dir ? dir + "/" : "") + name;
      toast("已重命名为 " + name);
      paintAll();
    });
  }
  function removeEntry(path) {
    confirm2("删除确认", "确定要删除 " + base(path) + " 吗？" + (isDir(path) ? "文件夹会连同内容一起删除。" : "") + "此项可撤销（演示）。", function () {
      var dir = bits(path).d.replace(/\/$/, "");
      var items = listDir(dir);
      var idx = -1;
      items.forEach(function (it, i) { if ((dir ? dir + "/" + it[0] : it[0]) === path) idx = i; });
      if (idx >= 0) items.splice(idx, 1);
      delete GIT[path];
      S.tabs = S.tabs.filter(function (t) { return t !== path && t !== "diff:" + path; });
      if (S.active === path || S.active === "diff:" + path) S.active = S.tabs[0] || null;
      toast("已删除 " + base(path));
      paintAll();
    });
  }

  /* ══════════ 模态框 ══════════ */
  function modal(title, desc, withInput, initial, onOk, okLabel, danger) {
    var wrap = el("div", "modal");
    var box = el("div", "box");
    box.innerHTML = "<h3>" + esc(title) + "</h3><p>" + esc(desc) + "</p>";
    var input;
    if (withInput) {
      input = el("input"); input.value = initial || ""; box.appendChild(input);
    }
    var row = el("div", "row3");
    var cancel = el("button", "", "取消");
    var ok = el("button", danger ? "dng" : "pri", okLabel || "确定");
    row.appendChild(cancel); row.appendChild(ok);
    box.appendChild(row);
    wrap.appendChild(box);
    app.appendChild(wrap);
    if (input) { input.focus(); input.select(); }
    function done(v) { wrap.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e) {
      if (e.key === "Escape") done();
      if (e.key === "Enter" && (!withInput || document.activeElement === input)) { var v = withInput ? input.value.trim() : true; done(); onOk(v); }
    }
    cancel.addEventListener("click", function () { done(); });
    ok.addEventListener("click", function () { var v = withInput ? input.value.trim() : true; done(); onOk(v); });
    document.addEventListener("keydown", onKey);
  }
  function prompt2(title, desc, initial, cb) { modal(title, desc, true, initial, cb, "确定"); }
  function confirm2(title, desc, cb) { modal(title, desc, false, "", cb, "删除", true); }

  /* ══════════ 全局绘制 ══════════ */
  function paintAll() {
    paintChrome(); paintSide(); paintTabs(); paintContent();
    if (S.view !== "files" || dirtyCount() === 0) $("#railBadge").hidden = !dirtyCount();
  }

  /* ══════════ 绑定 ══════════ */
  document.querySelectorAll(".rail [data-view]").forEach(function (b) {
    b.addEventListener("click", function () {
      S.view = b.dataset.view;
      if (S.view === "git" && !S.gitTab) S.gitTab = "changes";
      paintAll();
    });
  });
  function toggleTheme() { var d = document.documentElement; d.dataset.theme = d.dataset.theme === "dark" ? "light" : "dark"; }
  $("#themeBtn").addEventListener("click", toggleTheme);
  $("#railTheme").addEventListener("click", toggleTheme);
  $("#railHelp").addEventListener("click", function () {
    modal("快捷键", "Ctrl+Shift+E 资源管理器 · Ctrl+Shift+F 搜索 · Ctrl+Shift+G 源代码管理 · Ctrl+S 保存 · Ctrl+W 关闭标签 · Delete 删除选中项", false, "", function () { }, "知道了");
  });
  $("#rootChip").addEventListener("click", function () {
    var next = S.root === "main" ? "docs" : "main";
    S.root = next; S.selected = null; S.q = "";
    toast("已切换到 " + ROOTS.filter(function (r) { return r.id === next; })[0].label);
    paintAll();
  });
  $("#syncPush").addEventListener("click", function () { toast("已推送 3 个提交到 origin/main（演示）"); });
  $("#syncPull").addEventListener("click", function () { toast("已是最新，无需拉取（演示）"); });
  $("#syncFetch").addEventListener("click", function () { toast("已 fetch origin（演示）"); });
  $("#wrapBtn").addEventListener("click", function () {
    S.wrap = !S.wrap;
    $("#wrapBtn").setAttribute("aria-pressed", String(S.wrap));
    document.querySelectorAll(".codewrap pre, .codewrap textarea").forEach(function (n) { n.style.whiteSpace = S.wrap ? "pre-wrap" : "pre"; });
    toast(S.wrap ? "已开启自动换行" : "已关闭自动换行");
  });

  /* 侧栏拖宽 */
  (function () {
    var g = $("#gutter"), on = false;
    g.addEventListener("pointerdown", function (e) { on = true; g.setPointerCapture(e.pointerId); });
    g.addEventListener("pointermove", function (e) {
      if (!on) return;
      var rect = app.getBoundingClientRect();
      var w = Math.max(220, Math.min(520, e.clientX - rect.left - 46));
      $("#side").style.width = w + "px";
    });
    g.addEventListener("pointerup", function (e) { on = false; g.releasePointerCapture(e.pointerId); });
  })();

  /* 快捷键 */
  document.addEventListener("keydown", function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.shiftKey && e.key.toLowerCase() === "e") { e.preventDefault(); S.view = "files"; paintAll(); }
    if (mod && e.shiftKey && e.key.toLowerCase() === "g") { e.preventDefault(); S.view = "git"; S.gitTab = "changes"; paintAll(); }
    if (mod && e.shiftKey && e.key.toLowerCase() === "f") { e.preventDefault(); S.view = "search"; paintAll(); setTimeout(function () { var i = $("#sideBody input"); if (i) i.focus(); }, 30); }
    if (mod && e.key.toLowerCase() === "w") { e.preventDefault(); if (S.active) closeTab(S.active); }
    if (e.key === "Escape") closeMenu();
    if (e.key === "Delete" && S.view === "files" && S.selected && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault(); removeEntry(S.selected);
    }
  });

  /* 首屏：打开一个文件 + 树里选中，让两侧都有内容 */
  S.selected = "src/lib/git.ts";
  S.tabs = ["src/lib/git.ts"];
  S.active = "src/lib/git.ts";
  paintAll();
})();
</script>
</body>
</html>
